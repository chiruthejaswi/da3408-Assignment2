# ---------------------------------------------------------------------------
# Parallelism justification (do not skip when grading/reviewing):
#
# Cluster capacity: 2 nodes x 2 allocatable CPUs each = 4 allocatable CPUs total.
# Each pod's CPU request is set equal to its limit at "1" (1 full CPU) --
# a Guaranteed QoS pod that reserves exactly 1 CPU and cannot burst past it.
#
#   max concurrently SCHEDULABLE pods = floor(total allocatable CPU / CPU per pod)
#                                      = floor(4 / 1)
#                                      = 4
#
# Setting parallelism higher than 4 (e.g. parallelism: 8, matching completions)
# would not make the workload actually run 8-wide: the scheduler would place
# 4 pods as Running and leave the remaining pods Pending until CPU frees up,
# which contradicts the requirement that the chosen parallelism value is one
# that is ACTUALLY reached, not just permitted by the manifest. parallelism: 4
# is therefore the largest value the 4-CPU cluster can genuinely sustain
# concurrently, and completions: 8 means the Job runs in exactly 2 waves of 4.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: signup-validation
  labels:
    app: signup-validation
spec:
  completions: 8          # one pod per CSV shard (8 shards total)
  parallelism: 4          # justified above: 4 allocatable CPUs / 1 CPU-per-pod
  completionMode: Indexed # gives each pod a fixed 0..7 index via JOB_COMPLETION_INDEX
  backoffLimit: 4         # allow a couple of retries per index before failing the Job
  template:
    metadata:
      labels:
        app: signup-validation
    spec:
      restartPolicy: Never   # required for Jobs; retries are handled by backoffLimit instead
      containers:
        - name: validator
          image: signup-validator:latest
          imagePullPolicy: IfNotPresent   # image is loaded directly into minikube, not pulled from a registry
          resources:
            requests:
              cpu: "1"
              memory: "128Mi"
            limits:
              cpu: "1"        # request == limit -> Guaranteed QoS, matches the parallelism math exactly
              memory: "128Mi"
          env:
            # JOB_COMPLETION_INDEX is auto-injected by the Job controller for
            # completionMode: Indexed -- listed here only for clarity, not required.
            #
            # Downward API fields: how each pod learns which node it landed on,
            # and its own identity, without querying the API server itself.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
