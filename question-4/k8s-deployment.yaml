apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-api-deployment
  labels:
    app: spam-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below 2 Ready pods during an update -> zero downtime
      maxSurge: 1         # bring up 1 extra (new-version) pod before removing an old one
  selector:
    matchLabels:
      app: spam-api
  template:
    metadata:
      labels:
        app: spam-api
    spec:
      containers:
        - name: spam-api
          image: spam-api:v1
          imagePullPolicy: IfNotPresent   # image is loaded directly into minikube, not pulled from a registry
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3   # give the model a moment to load on startup
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spam-api-service
spec:
  type: ClusterIP
  selector:
    app: spam-api      # routes to any pod matching this label -- both replicas
  ports:
    - port: 80
      targetPort: 8000
